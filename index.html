</style></head><body><div class="app"><div class="sidebar-backdrop" id="backdrop" style="display:none;position:fixed;inset:0;background:#031e2480;z-index:25"></div><aside class="sidebar scrollbar" id="sidebar"><div class="logo"><div class="logo-mark"><span>⌁</span></div><div><strong>rumo.</strong><small>SEU MAPA DE ESTUDOS</small></div></div><div id="nav"></div><div class="sidefoot"><strong>Constância com direção.</strong>Seu planejamento se adapta aos seus registros.<div style="margin-top:12px"><span class="app-badge">● Salvo neste dispositivo</span></div></div></aside><div class="main"><header class="topbar"><div class="flex"><button class="btn secondary small mobile-toggle" id="mobile-menu" style="display:none" aria-label="Abrir menu">☰</button><div class="top-title" id="top-title">Meu espaço de estudos</div></div><div class="top-right"><span class="date-mini" id="top-date"></span><span class="pill">Dados locais</span></div></header><main class="content" id="page"></main></div></div><div class="modal-wrap" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-box" id="modal-box"></div></div><div id="toast" class="toast" role="status"></div><script>
(()=>{'use strict';
const STORAGE='rumo.study.v2';
const COLORS=['#4e9985','#547eaf','#b9946d','#9b78a4','#d08f7b','#578f92','#8eab64','#8d9ab4','#c2a65d','#739dca'];
const INITIAL=[
 ['Português',5,['Interpretação de textos','Classes de palavras','Concordância','Regência e crase','Pontuação','Coesão e coerência','Pronomes','Semântica']],
 ['Matemática',5,['Razão e proporção','Regra de três','Porcentagem','Frações','Potenciação e radiciação','MMC e MDC','Equações','Função quadrática','Probabilidade e combinatória']],
 ['Código de Trânsito (CTB)',5,['Normas de circulação','Sinalização','Infrações e penalidades','Medidas administrativas','Competências dos órgãos','Resoluções do CONTRAN']],
 ['Raciocínio Lógico',4,['Lógica proposicional','Conjuntos','Sequências','Análise combinatória','Problemas de lógica']],
 ['Informática',3,['Sistemas operacionais','Planilhas','Internet e navegadores','Segurança da informação']],
 ['Atualidades',2,['Política e sociedade','Meio ambiente','Economia','Tecnologia']],
 ['Direito Administrativo',3,['Atos administrativos','Poderes da administração','Agentes públicos']],
 ['Direito Constitucional',3,['Direitos fundamentais','Organização do Estado','Administração pública']]
];
const $=id=>document.getElementById(id);
const UID=()=>Math.random().toString(36).slice(2,11)+Date.now().toString(36).slice(-5);
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v)||0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function dk(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function dateObj(s){const [y,m,d]=String(s||dk(new Date())).split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(s,off){let d=dateObj(s);d.setDate(d.getDate()+off);return dk(d)}
function dow(s){return (dateObj(s).getDay()+6)%7}
function today(){return dk(new Date())}
function fmt(s,opts={weekday:'short',day:'2-digit',month:'short'}){return dateObj(s).toLocaleDateString('pt-BR',opts)}
function mtime(s){if(!/^\d\d:\d\d$/.test(s||''))return NaN;let [h,m]=s.split(':').map(Number);return h>=0&&h<24&&m>=0&&m<60?h*60+m:NaN}
function timetext(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function human(m){m=Math.max(0,Math.round(n(m)));return m>=60?`${Math.floor(m/60)}h${m%60?String(m%60).padStart(2,'0'):''}`:`${m}min`}
function pct(a,b){return b?Math.round(a/b*100):0}
function name(sid){return state.subjects.find(x=>x.id===sid)?.name||'Matéria removida'}
function subject(sid){return state.subjects.find(x=>x.id===sid)}
function prefBase(){return {weekdays:[true,true,true,true,true,false,false],weekend:[{start:'08:00',end:'10:00',start2:'',end2:''},{start:'08:00',end:'10:00',start2:'',end2:''}],sessionMinutes:45,breakMinutes:10,safety:10,reviewMinutes:25,revisionGaps:[1,3,7,15,30],nextStart:today(),selected:[]}}
function blank(){let ss=INITIAL.map((x,i)=>({id:UID(),name:x[0],weight:x[1],topics:x[2],color:COLORS[i]}));return {version:2,subjects:ss,records:[],plans:[],questions:[],reviews:[],cards:[],simulations:[],materials:[],exams:[],prefs:{...prefBase(),selected:ss.slice(0,6).map(s=>s.id)},log:[]}}
let state;
try{state=JSON.parse(localStorage.getItem(STORAGE))}catch{}
if(!state||!Array.isArray(state.subjects)||!Array.isArray(state.records))state=blank();
for(let key of ['plans','questions','reviews','cards','simulations','materials','exams','log'])if(!Array.isArray(state[key]))state[key]=[];
state.prefs={...prefBase(),...(state.prefs||{})};
let page='hoje',plannerDate=state.prefs.nextStart||today(),ui={},modalSave=null,lastToast;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));return true}catch(e){notify('Armazenamento cheio ou indisponível. Exporte um backup e reduza anexos.');return false}}
function notify(msg){let node=$('toast');node.textContent=msg;node.classList.add('show');clearTimeout(lastToast);lastToast=setTimeout(()=>node.classList.remove('show'),3500)}
function download(filename,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function metric(label,value,desc){return `<div class="metric"><div class="label">${escapeHTML(label)}</div><div class="number">${escapeHTML(value)}</div><div class="desc">${escapeHTML(desc||'')}</div></div>`}
function header(eyebrow,title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">${escapeHTML(eyebrow)}</div><h1>${escapeHTML(title)}</h1><p>${escapeHTML(desc)}</p></div><div class="actions no-print">${action}</div></div>`}
function empty(title,desc=''){return `<div class="empty-state"><span class="empty-icon">◇</span><strong>${escapeHTML(title)}</strong>${escapeHTML(desc)}</div>`}
function tag(label,type=''){return `<span class="status ${type}">${escapeHTML(label)}</span>`}
function card(title,body,side=''){return `<div class="card"><div class="flex between wrap" style="margin-bottom:17px"><h2>${escapeHTML(title)}</h2>${side}</div>${body}</div>`}
function input(id,label,type='text',value='',extra=''){return `<div class="field"><label for="${id}">${escapeHTML(label)}</label><input id="${id}" type="${type}" value="${escapeHTML(value)}" ${extra}></div>`}
function textarea(id,label,value='',rows=5){return `<div class="field long"><label for="${id}">${escapeHTML(label)}</label><textarea id="${id}" rows="${rows}">${escapeHTML(value)}</textarea></div>`}
function opt(items,value,placeholder){return (placeholder?`<option value="">${escapeHTML(placeholder)}</option>`:'')+items.map(i=>`<option value="${escapeHTML(i.value)}" ${String(value)===String(i.value)?'selected':''}>${escapeHTML(i.label)}</option>`).join('')}
function select(id,label,items,value='',placeholder=''){return `<div class="field"><label for="${id}">${escapeHTML(label)}</label><select id="${id}">${opt(items,value,placeholder)}</select></div>`}
function sOptions(value=''){return opt(state.subjects.map(s=>({value:s.id,label:s.name})),value,'Selecione a matéria')}
function tOptions(sid,selected=''){let ts=subject(sid)?.topics||[];if(selected&&!ts.includes(selected))ts=[...ts,selected];return opt(ts.map(t=>({value:t,label:t})),selected,'Selecione o assunto')}
function pctClass(correct,wrong){let q=correct+wrong;return q?`${pct(correct,q)}%`:'—'}
function statsRecords(records=state.records){return records.reduce((a,r)=>{a.minutes+=n(r.minutes);a.correct+=n(r.correct);a.wrong+=n(r.wrong);return a},{minutes:0,correct:0,wrong:0})}
function topicStats(){let map=new Map();for(let r of state.records){let key=r.subjectId+'|'+r.topic,obj=map.get(key)||{subjectId:r.subjectId,topic:r.topic,minutes:0,correct:0,wrong:0,count:0};obj.minutes+=n(r.minutes);obj.correct+=n(r.correct);obj.wrong+=n(r.wrong);obj.count++;map.set(key,obj)}for(let a of state.questions){let key=a.subjectId+'|'+a.topic,obj=map.get(key)||{subjectId:a.subjectId,topic:a.topic,minutes:0,correct:0,wrong:0,count:0};for(let at of a.attempts||[]){if(at.correct)obj.correct++;else obj.wrong++}map.set(key,obj)}return [...map.values()]}
function subjectStats(sid){let q=topicStats().filter(t=>t.subjectId===sid);return q.reduce((o,t)=>(o.correct+=t.correct,o.wrong+=t.wrong,o.minutes+=t.minutes,o),{correct:0,wrong:0,minutes:0})}
function priority(sid){let s=subject(sid),stat=subjectStats(sid),q=stat.correct+stat.wrong;return (s?.weight||1)*(1+(q?stat.wrong/q*.6:0))}
function progressExam(exam){let total=exam.topics?.length||0,done=(exam.topics||[]).filter(x=>x.status==='Consolidado'||x.status==='Estudado').length;return pct(done,total)}
function allSessions(){return state.plans.flatMap(p=>p.sessions.map(s=>({...s,planId:p.id})))}
function planForDate(date){return state.plans.find(p=>date>=p.start&&date<=addDays(p.start,6))}
function sessionsFor(date){return state.plans.flatMap(p=>p.sessions.filter(s=>s.date===date).map(s=>({...s,planId:p.id}))).sort((a,b)=>a.start.localeCompare(b.start))}
function dueQuestions(day=today()){return state.questions.filter(x=>x.nextReview&&x.nextReview<=day)}
function dueCards(day=today()){return state.cards.filter(x=>x.nextReview&&x.nextReview<=day)}
function dueTopics(day=today()){return state.reviews.filter(x=>x.status!=='completed'&&x.due<=day)}
function pendingCount(){return allSessions().filter(s=>s.status==='pending').length}
function addRevisions(record){for(let gap of (state.prefs.revisionGaps||[1,3,7])){let id=UID();let r={id,sourceId:record.id,sourceType:'record',subjectId:record.subjectId,topic:record.topic,due:addDays(record.date,gap),gap,kind:'topic',status:'pending',nextReview:false};state.reviews.push(r);scheduleLinkedRevision(r)}}
function scheduleLinkedRevision(r){
 let active=state.plans.find(p=>r.due>=p.start&&r.due<=addDays(p.start,6));
 if(!active)return;
 if(active.sessions.some(x=>x.reviewRefs?.some(z=>z.kind===r.kind&&z.id===r.id)))return;
 let dur=Math.min(25,n(state.prefs.reviewMinutes)||25),candidate=null;
 // Prefer a vacant interval, preserving studies already programmed.
 for(let shift=0;shift<7&&!candidate;shift++){
  let d=addDays(r.due,shift);if(d>addDays(active.start,6))break;
  for(let [a,b] of windows(d,active.config))for(let t=a;t+dur<=b;t+=5){if(isSlotFree(d,t,t+dur)){candidate={date:d,start:timetext(t),end:timetext(t+dur),minutes:dur};break}}
 }
 // If there is no free time, displace a nonlocked, lower priority study, keeping it pending.
 if(!candidate){let studies=active.sessions.filter(x=>x.type==='study'&&x.status==='planned'&&!x.locked&&x.date>=r.due).sort((a,b)=>priority(a.subjectId)-priority(b.subjectId));let displaced=studies[0];if(!displaced)return;candidate={date:displaced.date,start:displaced.start,end:timetext(mtime(displaced.start)+dur),minutes:dur};displaced.status='pending';displaced.originalDate=displaced.originalDate||displaced.date;}
 active.sessions.push({...candidate,id:UID(),type:'review',subjectId:r.subjectId,topic:r.topic,reviewRefs:[{kind:r.kind,id:r.id}],status:'planned',locked:false});
 // Relocate displaced studies into available future hours without deleting them.
 if(active.sessions.some(x=>x.status==='pending'))reallocateQuiet();
}
function reallocateQuiet(){let list=state.plans.flatMap(p=>p.sessions).filter(x=>x.status==='pending'&&!x.locked);for(let x of list){let spot=findFreeSlot(x,x.originalDate?addDays(x.originalDate,1):today());if(spot)Object.assign(x,spot,{status:'remapped'})}}
function markLinkedReviewComplete(kind,id){for(let p of state.plans)for(let x of p.sessions||[])if(x.reviewRefs?.some(z=>z.kind===kind&&z.id===id)){x.status='completed';x.completedAt=new Date().toISOString()}}
function reviseRevisionsForRecord(record){for(let r of state.reviews.filter(r=>r.sourceId===record.id&&r.sourceType==='record')){r.subjectId=record.subjectId;r.topic=record.topic;if(!r.completedAt)r.due=addDays(record.date,r.gap||1)}}
function formatStatus(s){let key=s.status||'planned';let text={planned:'Planejado',completed:'Concluído',pending:'Pendente',remapped:'Remanejado'}[key]||'Planejado';return tag(text,key)}
function statusFor(s){return s.status==='completed'?'completed':s.status==='pending'?'pending':s.status==='remapped'?'remapped':'planned'}

function viabilityHtml(cfg){let v=viability(cfg),existing=state.plans.find(p=>p.start===cfg.start),used=existing?existing.sessions.filter(x=>x.date>=cfg.start&&x.date<=addDays(cfg.start,6)).reduce((a,x)=>a+n(x.minutes),0):v.required,ratio=v.effective?pct(used,v.effective):0,remaining=v.effective-used,s=ratio>100?'inviable':ratio>=85?'attention':'',label=ratio>100?'Inviável':ratio>=85?'Atenção':'Viável';return `<div class="health ${s}"><div class="flex between"><strong>Saúde do cronograma · ${label}</strong><strong>${ratio}%</strong></div><div class="progressbar" style="margin:10px 0"><span style="width:${Math.min(100,ratio)}%;background:${s==='inviable'?'#ca6860':'#549e87'}"></span></div><div class="minor">Capacidade útil: ${human(v.effective)} · ${existing?'Carga planejada: ':'Demanda mínima estimada: '}${human(used)} · ${v.pending?human(v.pending)+' pendentes · ':''}${remaining<0?'Déficit '+human(-remaining):'Saldo '+human(remaining)}</div><div class="hint">Antes de gerar a grade, esta é uma estimativa mínima. Após gerar, a ocupação é calculada a partir das sessões criadas. Revise também as pendências de outros ciclos.</div></div>`}

function openTopicReview(id){let r=state.reviews.find(x=>x.id===id);if(!r)return;openModal('Revisão sem consulta',`<div class="quizbox"><strong>${escapeHTML(name(r.subjectId))} · ${escapeHTML(r.topic)}</strong><p>Tente explicar o assunto com suas palavras antes de consultar suas anotações.</p><p>Depois, responda a algumas questões e classifique seu nível de domínio.</p></div><div class="field" style="margin-top:13px"><label>Como foi a revisão?</label><select id="review-result"><option value="ok">Consegui explicar e responder</option><option value="hard">Tive dificuldade</option><option value="wrong">Não consegui recuperar</option></select></div>`,()=>{let result=$('review-result').value,gaps=state.prefs.revisionGaps||[1,3,7,15,30];r.status='completed';r.completedAt=today();markLinkedReviewComplete('topic',r.id);if(result!=='ok'){state.reviews.push({...r,id:UID(),due:addDays(today(),result==='hard'?3:1),status:'pending',completedAt:null,nextReview:true})}save();closeModal();render();notify('Revisão registrada.')},'Perguntas sem consulta e autoavaliação do conteúdo.')}
function openCard(id='',fromQuestion=''){let c=state.cards.find(c=>c.id===id),q=state.questions.find(q=>q.id===fromQuestion),sid=c?.subjectId||q?.subjectId||state.subjects[0]?.id||'',topic=c?.topic||q?.topic||subject(sid)?.topics?.[0]||'',front=c?.front||q?.text||'',back=c?.back||q?.explanation||'';openModal(c?'Editar flashcard':'Novo flashcard',`<div class="formgrid"><div class="field"><label>Matéria</label><select id="c-subject">${sOptions(sid)}</select></div><div class="field"><label>Assunto</label><select id="c-topic">${tOptions(sid,topic)}</select></div></div><div style="margin-top:14px">${textarea('c-front','Frente — pergunta',front,4)}</div><div style="margin-top:12px">${textarea('c-back','Verso — resposta',back,4)}</div>`,()=>{let sid=$('c-subject').value,topic=$('c-topic').value,front=$('c-front').value.trim(),back=$('c-back').value.trim();if(!sid||!topic||!front||!back)return notify('Complete matéria, assunto, pergunta e resposta.');if(c)Object.assign(c,{subjectId:sid,topic,front,back});else state.cards.push({id:UID(),subjectId:sid,topic,front,back,created:today(),nextReview:today(),intervalStep:0,history:[],sourceQuestionId:q?.id||null});updateAndRender();closeModal();notify('Flashcard salvo.')});$('c-subject').onchange=()=>{$('c-topic').innerHTML=tOptions($('c-subject').value)}}
function renderFlashcards(){let cards=[...state.cards].sort((a,b)=>(a.nextReview||'').localeCompare(b.nextReview||''));return header('RECUPERAÇÃO ATIVA','Flashcards.','Crie cartões próprios ou aproveite questões erradas para revisar conceitos.',`<button class="btn" data-action="add-card">+ Novo flashcard</button>`)+`<div class="notice">Geração automática de cartões por IA: <strong>não conectada nesta versão local</strong>. Exige serviço de IA e backend seguro. Você já pode criar, editar e revisar cartões, inclusive a partir de questões salvas.</div><div class="statsgrid" style="margin-top:17px">${metric('Cartões salvos',String(cards.length),'Na sua coleção')}${metric('Para revisar',String(dueCards().length),'Hoje e atrasados')}${metric('Revisões realizadas',String(cards.reduce((a,c)=>a+(c.history?.length||0),0)),'Histórico acumulado')}${metric('Assuntos cobertos',String(new Set(cards.map(c=>c.subjectId+'|'+c.topic)).size),'Com cartões')}</div><div class="card" style="margin-top:17px"><h2>Seus cartões</h2><div class="itemlist" style="margin-top:14px">${cards.length?cards.map(c=>`<div class="item"><div class="flex between wrap">${tag(name(c.subjectId)+' · '+c.topic)}${tag('Revisão: '+fmt(c.nextReview,{day:'2-digit',month:'short'}),c.nextReview<=today()?'pending':'planned')}</div><div class="itemtitle" style="margin-top:12px">${escapeHTML(c.front)}</div><div class="itemactions"><button class="btn tiny secondary" data-action="practice-card" data-id="${c.id}">Praticar</button><button class="btn tiny ghost" data-action="edit-card" data-id="${c.id}">Editar</button><button class="btn tiny ghost" data-action="delete-card" data-id="${c.id}">Excluir</button></div></div>`).join(''):empty('Nenhum cartão salvo','Cadastre um flashcard ou crie um a partir de uma questão errada.')}</div></div>`}

function rateCard(id,rate){let c=state.cards.find(c=>c.id===id);if(!c)return;let gaps=state.prefs.revisionGaps||[1,3,7,15,30];c.history.push({date:today(),rate});c.intervalStep=rate==='ok'?Math.min((c.intervalStep||0)+1,gaps.length-1):0;c.nextReview=addDays(today(),rate==='wrong'?1:rate==='hard'?3:gaps[c.intervalStep]);markLinkedReviewComplete('card',c.id);save();closeModal();render();notify('Flashcard avaliado. Próxima revisão: '+fmt(c.nextReview))}
function renderSimulados(){let summaries=state.simulations.slice().reverse();return header('PRÁTICA SEM CRONÔMETRO','Simulados.','Monte avaliações com as questões que você cadastrou. Sem contagem de tempo.',`<button class="btn" data-action="start-sim">+ Criar simulado</button>`)+`<div class="statsgrid">${metric('Simulados realizados',String(summaries.length),'Histórico')}${metric('Questões disponíveis',String(state.questions.length),'Banco pessoal')}${metric('Média de acertos',summaries.length?Math.round(summaries.reduce((a,x)=>a+pct(x.correct,x.total),0)/summaries.length)+'%':'—','Nos simulados')}${metric('Melhor resultado',summaries.length?Math.max(...summaries.map(x=>pct(x.correct,x.total)))+'%':'—','Maior aproveitamento')}</div><div class="card" style="margin-top:17px"><h2>Histórico</h2>${summaries.length?`<div class="itemlist" style="margin-top:15px">${summaries.map(x=>`<div class="priority"><div><strong>${fmt(x.date)} · ${escapeHTML(x.subject||'Todas as matérias')}</strong><div class="minor">${x.total} questões · ${x.correct} acertos · ${x.total-x.correct} erros</div></div>${tag(pct(x.correct,x.total)+'%')}</div>`).join('')}</div>`:empty('Nenhum simulado realizado','Adicione questões ao seu caderno e gere um simulado.')}</div>`}
function startSimulation(){if(!state.questions.length)return notify('Cadastre questões antes de criar um simulado.');openModal('Configurar simulado',`<div class="formgrid"><div class="field"><label>Matéria</label><select id="sim-subject"><option value="">Todas as matérias</option>${state.subjects.map(x=>`<option value="${x.id}">${escapeHTML(x.name)}</option>`).join('')}</select></div>${input('sim-quantity','Quantidade de questões','number',Math.min(10,state.questions.length),'min="1" max="100"')}</div><div class="notice" style="margin-top:13px">O simulado usa questões do seu banco pessoal. Não há cronômetro nem questões externas importadas automaticamente.</div>`,()=>{let sid=$('sim-subject').value,num=clamp(Number($('sim-quantity').value)||1,1,100),pool=state.questions.filter(x=>!sid||x.subjectId===sid);if(!pool.length)return notify('Nenhuma questão nessa matéria.');let chosen=pool.slice().sort(()=>Math.random()-.5).slice(0,num);ui.simulation={ids:chosen.map(x=>x.id),index:0,answers:{},subject:sid?name(sid):'Todas as matérias'};closeModal();showSimQuestion()})}
function showSimQuestion(){let sim=ui.simulation;if(!sim)return;let id=sim.ids[sim.index],q=state.questions.find(x=>x.id===id);if(!q){closeModal();return}let opts=q.type==='truefalse'?[{label:'Certo',text:'Certo'},{label:'Errado',text:'Errado'}]:q.options?.length?q.options:['A','B','C','D','E'].map(x=>({label:x,text:x}));$('modal-box').innerHTML=`<div class="modal-head"><div><h2>Simulado · ${sim.index+1}/${sim.ids.length}</h2><p>Gabaritos exibidos somente no encerramento.</p></div><button class="btn small secondary" data-close>Fechar ×</button></div><div class="quizbox">${escapeHTML(q.text)}${q.image?`<img class="image-preview" src="${q.image}">`:''}</div><div class="choices">${opts.map(o=>`<label class="choice"><input type="radio" name="sim-answer" value="${escapeHTML(o.label)}" ${sim.answers[id]===o.label?'checked':''}> <b>${escapeHTML(o.label)})</b> ${escapeHTML(o.text)}</label>`).join('')}</div><div class="modal-foot"><button class="btn" data-action="sim-next">${sim.index===sim.ids.length-1?'Finalizar simulado':'Próxima questão →'}</button></div>`;$('modal').classList.add('open')}
function simNext(){let sim=ui.simulation,id=sim.ids[sim.index],selected=document.querySelector('input[name="sim-answer"]:checked')?.value;if(!selected)return notify('Selecione uma resposta.');sim.answers[id]=selected;if(sim.index<sim.ids.length-1){sim.index++;showSimQuestion();return}let correct=0;for(let id of sim.ids){let q=state.questions.find(q=>q.id===id),chosen=sim.answers[id],right=chosen===q.answer;if(right)correct++;q.attempts.push({id:UID(),date:today(),chosen,correct:right,source:'simulado'});if(!right){q.nextReview=addDays(today(),1);q.intervalStep=0}}state.simulations.push({id:UID(),date:today(),subject:sim.subject,correct,total:sim.ids.length,ids:[...sim.ids]});ui.simulation=null;updateAndRender();$('modal-box').innerHTML=`<div class="modal-head"><h2>Simulado concluído</h2></div><div class="metric"><div class="label">Seu aproveitamento</div><div class="number">${pct(correct,sim.ids.length)}%</div><div class="desc">${correct} acertos · ${sim.ids.length-correct} erros. Os erros foram programados para revisão.</div></div><div class="modal-foot"><button class="btn" data-close>Fechar resultado</button></div>`}

function renderRelatorios(){let days=30,dates=Array.from({length:days},(_,i)=>addDays(today(),-i)),last=state.records.filter(r=>r.date>=dates[days-1]&&r.date<=today()),st=statsRecords(last),allQ=st.correct+st.wrong,missed=state.questions.filter(q=>(q.attempts||[]).filter(a=>!a.correct).length>=2),sp=state.subjects.map(s=>({name:s.name,stats:subjectStats(s.id)})).filter(x=>x.stats.minutes>0).sort((a,b)=>b.stats.minutes-a.stats.minutes),due=dueQuestions().length+dueTopics().length+dueCards().length,plans=allSessions().filter(s=>s.date>=dates[days-1]&&s.date<=today()),done=plans.filter(s=>s.status==='completed').length;return header('RELATÓRIO DE 30 DIAS','Sua evolução recente.','Resumo do que foi realmente estudado nos últimos 30 dias.',`<button class="btn secondary" data-action="print-report">Imprimir / salvar PDF</button>`)+`<div class="statsgrid">${metric('Tempo estudado',human(st.minutes),'Últimos 30 dias')}${metric('Questões registradas',String(allQ),'Últimos 30 dias')}${metric('Aproveitamento',allQ?pct(st.correct,allQ)+'%':'—','Nos registros de sessões')}${metric('Cumprimento',plans.length?pct(done,plans.length)+'%':'—',done+' / '+plans.length+' sessões')}</div><div class="columns" style="margin-top:17px">${card('Matérias mais estudadas',sp.length?sp.map(x=>`<div class="priority"><strong>${escapeHTML(x.name)}</strong><span>${human(x.stats.minutes)}</span></div>`).join(''):empty('Ainda sem registros'))}${card('Próximas ações',`<div class="priority"><span>Revisões devidas</span><b>${due}</b></div><div class="priority"><span>Atividades pendentes</span><b>${pendingCount()}</b></div><div class="priority"><span>Questões com erro recorrente</span><b>${missed.length}</b></div><div class="priority"><span>Assuntos ainda cadastrados</span><b>${state.subjects.reduce((a,s)=>a+s.topics.length,0)}</b></div>`)}</div><div class="card" style="margin-top:15px"><h2>Recomendações baseadas nos registros</h2><div class="itemlist" style="margin-top:15px">${missed.length?`<div class="notice warn">Revisite ${missed.length} questão(ões) com erros repetidos, tentando respondê-las antes de consultar o gabarito.</div>`:''}${due?`<div class="notice">Há ${due} revisão(ões) pendentes. Use a página Revisões para recuperá-las.</div>`:''}${pendingCount()?`<div class="notice warn">Há ${pendingCount()} sessão(ões) pendentes. Execute o remanejamento no Cronograma.</div>`:''}${!missed.length&&!due&&!pendingCount()?`<div class="notice">Continue registrando sessões e questões; recomendações específicas aparecerão quando houver dados suficientes.</div>`:''}</div></div>`}
function renderConfig(){let p=state.prefs;return header('PERSONALIZAÇÃO E SEGURANÇA','Configurações.','Ajuste os critérios e faça backups. Os dados ficam somente neste navegador.',`<button class="btn secondary" data-action="export">Exportar backup</button>`)+`<div class="columns"><div class="card"><h2>Revisões e planejamento</h2><div class="formgrid" style="margin-top:16px">${input('cfg-mins','Sessão padrão (min)','number',p.sessionMinutes,'min="20" max="120"')}${input('cfg-break','Pausa entre sessões (min)','number',p.breakMinutes,'min="0" max="30"')}${input('cfg-safety','Margem de segurança (%)','number',p.safety,'min="0" max="40"')}${input('cfg-review','Duração sugerida revisão (min)','number',p.reviewMinutes,'min="10" max="60"')}</div><div style="margin-top:15px">${input('cfg-gaps','Intervalos para revisão (dias, separados por vírgula)','text',(p.revisionGaps||[1,3,7,15,30]).join(', '))}</div><div style="margin-top:17px"><button class="btn" data-action="save-config">Salvar preferências</button></div></div><div class="card"><h2>Dados e integrações</h2><div class="itemlist" style="margin-top:15px"><div class="priority"><div><strong>Backup JSON</strong><div class="smallnote">Exportar ou restaurar os registros.</div></div><div class="actions"><button class="btn tiny secondary" data-action="export">Exportar</button><button class="btn tiny secondary" data-action="import">Importar</button></div></div><div class="priority"><div><strong>Exportação para agenda</strong><div class="smallnote">Arquivo .ics compatível com calendários.</div></div><button class="btn tiny secondary" data-action="export-ics">Baixar .ics</button></div><div class="priority"><div><strong>Google Agenda (OAuth)</strong><div class="smallnote">Sincronização bidirecional requer servidor/autorização.</div></div>${tag('Não configurado','planned')}</div><div class="priority"><div><strong>IA para PDFs e flashcards</strong><div class="smallnote">Requer integração de API com chaves protegidas.</div></div>${tag('Não configurado','planned')}</div><div class="priority"><div><strong>PWA</strong><div class="smallnote">Instalação quando aberto por HTTPS ou localhost.</div></div>${tag('Preparado')}</div></div><div class="line"></div><button class="btn danger small" data-action="reset">Apagar todos os dados</button></div></div><div class="card" style="margin-top:15px"><h2>Sobre os dados</h2><div class="smallnote" style="margin-top:12px">Esta edição funciona sem login e sem nuvem: nenhuma informação é enviada a um servidor. Use os backups JSON para levar o histórico a outro navegador. O arquivo .ics permite importar os estudos no Google Agenda, mas não é sincronização automática. Para sincronização real, geração de conteúdo por IA e importação inteligente de PDFs, será necessário configurar serviços externos.</div></div><input id="import-file" type="file" accept="application/json,.json" hidden>`}
function saveConfig(){let p=state.prefs,mins=Number($('cfg-mins').value),pauses=Number($('cfg-break').value),margin=Number($('cfg-safety').value),review=Number($('cfg-review').value),gaps=$('cfg-gaps').value.split(',').map(x=>Number(x.trim()));if(!Number.isInteger(mins)||mins<20||mins>120||!Number.isInteger(pauses)||pauses<0||pauses>30||margin<0||margin>40||!Number.isInteger(review)||review<10||review>60||!gaps.length||gaps.some(v=>!Number.isInteger(v)||v<1||v>365))return notify('Confira os intervalos e limites das configurações.');Object.assign(p,{sessionMinutes:mins,breakMinutes:pauses,safety:margin,reviewMinutes:review,revisionGaps:[...new Set(gaps)].sort((a,b)=>a-b)});cycle=null;updateAndRender();notify('Preferências salvas.')}
function exportICS(){let ss=allSessions().filter(x=>x.status!=='pending');if(!ss.length)return notify('Nenhuma sessão planejada para exportar.');let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Rumo Estudos//pt-BR\r\n';let utc=(date,time)=>date.replace(/-/g,'')+'T'+time.replace(':','')+'00';let escICS=t=>String(t).replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');for(let s of ss){ics+=`BEGIN:VEVENT\r\nUID:${s.id}@rumo.local\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}\r\nDTSTART:${utc(s.date,s.start)}\r\nDTEND:${utc(s.date,s.end)}\r\nSUMMARY:${escICS((s.type==='review'?'Revisão':'Estudos')+' — '+name(s.subjectId))}\r\nDESCRIPTION:${escICS(s.topic||'') }\r\nEND:VEVENT\r\n`}ics+='END:VCALENDAR';download('rumo-cronograma.ics',ics,'text/calendar;charset=utf-8')}
function handleAction(button){let d=button.dataset,id=d.id,act=d.action;
switch(act){
case'add-record':openRecord('',d.session||'');break;
case'edit-record':openRecord(id);break;
case'delete-record':deleteRecord(id);break;
case'generate':generateSchedule();break;
case'reallocate':reallocate(false);break;
case'skip-session':skipSession(d.session);break;
case'toggle-lock':{let s=findSession(d.session);if(s){s.locked=!s.locked;updateAndRender()}break}
case'add-question':openQuestion();break;
case'edit-question':openQuestion(id);break;
case'delete-question':deleteQuestion(id);break;
case'quiz-question':openQuiz(id);break;
case'topic-review':openTopicReview(id);break;
case'add-card':openCard();break;
case'edit-card':openCard(id);break;
case'card-from-question':openCard('',id);break;
case'delete-card':if(confirm('Excluir este flashcard?')){state.cards=state.cards.filter(c=>c.id!==id);updateAndRender()}break;
case'practice-card':practiceCard(id);break;
case'rate-card':rateCard(id,d.rate);break;
case'start-sim':startSimulation();break;
case'sim-next':simNext();break;
case'add-exam':openExam();break;
case'edit-exam':openExam(id);break;
case'delete-exam':if(confirm('Excluir o edital?')){state.exams=state.exams.filter(x=>x.id!==id);updateAndRender()}break;
case'add-subject':openSubject();break;
case'edit-subject':openSubject(id);break;
case'delete-subject':{if(state.subjects.length<=1)return notify('Mantenha pelo menos uma matéria.');let s=subject(id);if(confirm('Excluir matéria '+s?.name+'? Registros antigos continuarão armazenados.')){state.subjects=state.subjects.filter(s=>s.id!==id);state.prefs.selected=state.prefs.selected.filter(x=>x!==id);cycle=null;updateAndRender()}break}
case'add-material':openMaterial();break;
case'edit-material':openMaterial(id);break;
case'delete-material':if(confirm('Excluir material?')){state.materials=state.materials.filter(x=>x.id!==id);updateAndRender()}break;
case'print-report':window.print();break;
case'save-config':saveConfig();break;
case'export':download('rumo-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');notify('Backup exportado.');break;
case'import':$('import-file')?.click();break;
case'export-ics':exportICS();break;
case'reset':if(confirm('ATENÇÃO: apagar TODOS os seus dados locais? Faça backup antes.')){if(confirm('Confirmar exclusão definitiva?')){state=blank();save();cycle=null;render();notify('Dados reiniciados.')}}break;
}}
document.addEventListener('click',event=>{let nav=event.target.closest('[data-nav]');if(nav){openPage(nav.dataset.nav);return}if(event.target.closest('[data-close]')){closeModal();return}let btn=event.target.closest('[data-action]');if(btn){event.preventDefault();handleAction(btn)}});
document.addEventListener('submit',event=>{if(event.target.id==='dialog-form'){handleDialog(event)}});
document.addEventListener('change',async event=>{let t=event.target,d=t.dataset;
if(t.id==='planner-start'){if(!t.value)return;plannerDate=t.value;cycle=null;render();return}
if(t.id==='planner-length'){getCycle().sessionMinutes=clamp(n(t.value),20,120);render();return}
if(t.id==='planner-break'){getCycle().breakMinutes=clamp(n(t.value),0,30);render();return}
if(t.id==='planner-safety'){getCycle().safety=clamp(n(t.value),0,40);render();return}
if(d.cycleDay!==undefined){getCycle().days[+d.cycleDay]=t.checked;render();return}
if(d.cycleSubject){let ids=getCycle().selected;if(t.checked&&!ids.includes(d.cycleSubject))ids.push(d.cycleSubject);else if(!t.checked)getCycle().selected=ids.filter(id=>id!==d.cycleSubject);render();return}
if(d.weekend!==undefined){getCycle().weekend[Number(d.weekend)][d.part]=t.value;render();return}
if(t.classList.contains('inline-status')){let ex=state.exams.find(x=>x.id===d.examId);if(ex?.topics?.[+d.topicIndex]){ex.topics[+d.topicIndex].status=t.value;updateAndRender()}return}
if(t.id==='record-filter'||t.id==='question-filter')applyFilter();
if(t.id==='import-file'&&t.files?.[0]){try{let file=t.files[0];if(file.size>20*1024*1024)throw Error('Arquivo muito grande.');let object=JSON.parse(await file.text());if(!Array.isArray(object.subjects)||!Array.isArray(object.records)||!Array.isArray(object.plans))throw Error('Backup incompatível.');if(!confirm('Substituir os dados atuais por este backup?'))return;state=object;for(let k of ['questions','reviews','cards','simulations','materials','exams','log'])if(!Array.isArray(state[k]))state[k]=[];state.prefs={...prefBase(),...(state.prefs||{})};cycle=null;plannerDate=state.prefs.nextStart||today();updateAndRender();notify('Backup restaurado.')}catch(e){notify('Erro na importação: '+e.message)}finally{t.value=''}}
});
document.addEventListener('input',event=>{if(event.target.id==='record-search'||event.target.id==='question-search')applyFilter()});
function applyFilter(){if(page==='registros'){
let query=($('record-search')?.value||'').toLowerCase(),sid=$('record-filter')?.value||'',list=state.records.filter(r=>(!sid||r.subjectId===sid)&&(!query||[name(r.subjectId),r.topic].join(' ').toLowerCase().includes(query))).sort((a,b)=>b.date.localeCompare(a.date));if($('record-rows'))$('record-rows').innerHTML=recordRows(list)}
if(page==='erros'){let query=($('question-search')?.value||'').toLowerCase(),sid=$('question-filter')?.value||'',list=state.questions.filter(q=>(!sid||q.subjectId===sid)&&(!query||[q.code,q.text,q.topic,name(q.subjectId)].join(' ').toLowerCase().includes(query)));if($('question-list'))$('question-list').innerHTML=questionList(list)}
}
$('mobile-menu').onclick=()=>{$('sidebar').classList.toggle('open');$('backdrop').classList.toggle('open')};$('backdrop').onclick=()=>{$('sidebar').classList.remove('open');$('backdrop').classList.remove('open')};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const hash=location.hash.replace('#','');if(NAV.some(group=>group[1].some(([k])=>k===hash)))page=hash;
render();reallocate(true);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
