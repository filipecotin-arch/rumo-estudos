<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JG+ Estúdio | Demonstração de Gestão</title>
<style>
:root{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;color:#263b42;background:#f5f7f8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.banner{background:#e8f4ed;color:#275f4a;text-align:center;padding:10px;font-size:12px}.shell{display:flex;min-height:calc(100vh - 36px)}aside{width:245px;background:#152e38;color:#b9c9cd;display:flex;flex-direction:column;gap:26px;padding:24px 15px}.brand{color:#fff;padding:5px 12px;font-size:22px;font-weight:750}.brand span{color:#d0ad78}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#819fa7}nav{display:grid;gap:5px}nav button{border:0;text-align:left;padding:12px 14px;background:none;color:#c3d1d3;border-radius:9px}nav button.active,nav button:hover{background:#294952;color:white}aside footer{margin-top:auto;border-top:1px solid #36505a;padding:15px 10px;color:#8ea5aa;font-size:12px}main{min-width:0;flex:1}.top{height:75px;background:#fff;border-bottom:1px solid #e1e7e8;padding:24px 34px;display:flex;justify-content:space-between;gap:10px}.workspace{padding:32px;max-width:1540px;margin:auto}.eyebrow{letter-spacing:2px;color:#b18d60;font-weight:700;font-size:10px;text-transform:uppercase}h1{margin:9px 0 8px;font-size:32px;letter-spacing:-1px}p{color:#839198;margin:0 0 24px;line-height:1.6}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.btn{background:#214e52;color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600}.btn.secondary{background:#fff;color:#365d61;border:1px solid #dce4e5}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:20px 0 30px}.metric,.panel{background:#fff;border:1px solid #e3e8ea;border-radius:14px;box-shadow:0 2px 8px #14333c06}.metric{padding:22px}.metric b{display:block;font-size:30px;margin-top:20px}.muted{color:#8b9ba1;font-size:12px}.metric .muted{display:block}.panel{padding:20px;margin:15px 0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}input,select{border:1px solid #dbe4e6;border-radius:8px;padding:8px 9px;min-width:0;background:#fff;color:#2b414a}input[type="search"]{min-width:270px}.tablebox{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:740px}th{font-size:11px;text-align:left;color:#748c94;background:#f6f8f9}th,td{padding:12px 11px;border-bottom:1px solid #edf0f1}td input,td select{width:100%;border-color:transparent;background:transparent}td input:focus,td select:focus{border-color:#9fafa8;background:#fff}.tag{border-radius:6px;padding:7px 9px;display:inline-block;color:#244248;background:#e0efed;font-size:12px}.due{color:#607d86}.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}.activity{padding:14px 0;border-bottom:1px solid #eef1f2;display:flex;justify-content:space-between;gap:12px}.activity b{display:block}.activity small{display:block;margin-top:4px;color:#83979e}.empty{padding:35px;text-align:center;color:#899ca3}.row{display:flex;gap:8px;align-items:center}.progress{height:8px;background:#ebeeee;border-radius:10px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#4a917e}.note{background:#fbf8f1;border:1px solid #efe1c7;border-radius:9px;padding:14px;color:#776a4d;margin:16px 0;font-size:12px}.footnote{color:#86969d;font-size:12px;margin-top:18px}@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}aside{width:100%;padding:14px;gap:12px;position:static}nav{display:flex;overflow:auto}nav button{white-space:nowrap}aside footer{display:none}.workspace{padding:18px}.top{padding:19px;height:auto}h1{font-size:26px}.metrics{gap:9px}.metric{padding:15px}.metric b{font-size:24px}.banner{font-size:11px}input[type="search"]{min-width:180px}}
</style></head><body><div class="banner"><b>JG+ · DEMONSTRAÇÃO PÚBLICA</b> — Somente dados fictícios; alterações salvas neste navegador. Não cadastre informações reais.</div>
<div class="shell"><aside><div class="brand">JG<span>+</span> Estúdio<small>GESTÃO DE PROJETOS</small></div><nav id="nav"></nav><footer>Protótipo para testes visuais<br>Sem contas reais ou contratos</footer></aside><main><div class="top"><b>JG+ / <span id="crumb">Visão geral</span></b><span class="muted">Ambiente de demonstração</span></div><div class="workspace" id="workspace"></div></main></div>
<script>
const key='jg-demo-publica-v1',today=new Date(),date=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const STATUS=['Não iniciado','Em andamento','Aguardando cliente','Em revisão','Concluído','Pausado','Atrasado'];
const PRIOR=['Baixa','Média','Alta','Crítica'];
const STAGES=['Briefing','Estudo preliminar','Anteprojeto','Executivo','Compatibilização','Revisão','Entrega'];
const names={dashboard:'Visão geral',projects:'Projetos',tasks:'Demandas',calendar:'Agenda e prazos',reports:'Indicadores',help:'Sobre a demonstração'};
const initial=()=>({projects:[
{id:'p1',name:'Residência Modelo',client:'Cliente Exemplo A',owner:'Equipe A',stage:'Anteprojeto',status:'Em andamento',priority:'Alta',due:date(14)},
{id:'p2',name:'Espaço Comercial Modelo',client:'Cliente Exemplo B',owner:'Equipe B',stage:'Estudo preliminar',status:'Aguardando cliente',priority:'Média',due:date(22)},
{id:'p3',name:'Reforma Modelo',client:'Cliente Exemplo C',owner:'Equipe A',stage:'Executivo',status:'Em revisão',priority:'Baixa',due:date(7)}
],tasks:[
{id:'t1',title:'Revisar implantação',project:'p1',owner:'Equipe A',status:'Em andamento',priority:'Alta',due:date(3)},
{id:'t2',title:'Conferir levantamento',project:'p2',owner:'Equipe B',status:'Aguardando cliente',priority:'Média',due:date(8)},
{id:'t3',title:'Compatibilizar instalações',project:'p3',owner:'Equipe A',status:'Em revisão',priority:'Alta',due:date(5)}
]});
let data;try{data=JSON.parse(localStorage.getItem(key))||initial()}catch{data=initial()}let page='dashboard',query='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>s?s.split('-').reverse().join('/').slice(0,10):'—';const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch(e){alert('Não foi possível salvar localmente.')}};const badge=s=>'<span class="tag">'+esc(s)+'</span>';
const head=(title,sub,actions='')=>'<div class="head"><div><div class="eyebrow">JG+ ESTÚDIO · AMBIENTE DE TESTES</div><h1>'+title+'</h1><p>'+sub+'</p></div>'+actions+'</div>';
const metric=(t,n,s)=>'<div class="metric"><span class="muted">'+t+'</span><b>'+n+'</b><span class="muted">'+s+'</span></div>';
function render(){document.getElementById('crumb').textContent=names[page];document.getElementById('nav').innerHTML=Object.keys(names).map(id=>'<button class="'+(id===page?'active':'')+'" data-page="'+id+'">'+({dashboard:'◫',projects:'▦',tasks:'☷',calendar:'▤',reports:'◴',help:'?'}[id])+' &nbsp;'+names[id]+'</button>').join('');
const el=document.getElementById('workspace');const projects=data.projects,tasks=data.tasks;const active=tasks.filter(t=>t.status!=='Concluído');const overdue=active.filter(t=>t.due<date(0));const soon=active.filter(t=>t.due<=date(7)&&t.due>=date(0));
if(page==='dashboard')el.innerHTML=head('Visão geral','Acompanhe os projetos, demandas e entregas do escritório.','<button class="btn" data-page="projects">Ver projetos →</button>')+'<div class="metrics">'+metric('Projetos cadastrados',projects.length,'Registros fictícios')+metric('Demandas abertas',active.length,'Atividades pendentes')+metric('Próximas entregas',soon.length,'Nos próximos 7 dias')+metric('Demandas atrasadas',overdue.length,'Exigem atenção')+'</div><div class="grid2"><section class="panel"><h2>Próximas entregas</h2>'+tasks.slice().sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6).map(t=>'<div class="activity"><div><b>'+esc(t.title)+'</b><small>'+esc(projects.find(p=>p.id===t.project)?.name||'')+'</small></div>'+fmt(t.due)+'</div>').join('')+'</section><section class="panel"><h2>Resumo da operação</h2>'+STATUS.slice(0,5).map(s=>{const n=tasks.filter(t=>t.status===s).length;return '<div class="activity"><div>'+badge(s)+'</div><b>'+n+'</b></div>'}).join('')+'</section></div>';
else if(page==='projects'||page==='tasks'){const entity=page,rows=data[entity].filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(query.toLowerCase()))),isP=entity==='projects';const cols=isP?[['name','Projeto'],['client','Cliente'],['owner','Responsável'],['stage','Etapa'],['status','Status'],['priority','Prioridade'],['due','Prazo']]:[['title','Demanda'],['project','Projeto'],['owner','Responsável'],['status','Status'],['priority','Prioridade'],['due','Prazo']];el.innerHTML=head(names[page],isP?'Edite nomes, etapas, responsáveis e etiquetas diretamente na tabela.':'Organize as atividades e acompanhe seus prazos.','<button class="btn" data-add="'+entity+'">＋ Novo registro</button>')+'<section class="panel"><div class="toolbar"><input type="search" id="search" placeholder="Pesquisar registros..." value="'+esc(query)+'"><button class="btn secondary" id="reset">Restaurar demonstração</button></div><div class="tablebox"><table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'<th></th></tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(([field])=>'<td>'+inputFor(entity,r,field)+'</td>').join('')+'<td><button class="btn secondary" data-delete="'+entity+'" data-id="'+esc(r.id)+'">Excluir</button></td></tr>').join('')+'</tbody></table></div><p class="footnote">'+rows.length+' registros · alterações automáticas neste navegador</p></section>';}
else if(page==='calendar'){const rows=[...projects.map(p=>({name:p.name,due:p.due,type:'Projeto'})),...tasks.map(t=>({name:t.title,due:t.due,type:'Demanda'}))].sort((a,b)=>a.due.localeCompare(b.due));el.innerHTML=head('Agenda e prazos','Datas reunidas a partir das tabelas de projetos e demandas.')+'<section class="panel"><h2>Próximas datas</h2>'+rows.map(x=>'<div class="activity"><div><b>'+esc(x.name)+'</b><small>'+x.type+'</small></div>'+fmt(x.due)+'</div>').join('')+'</section>';}
else if(page==='reports')el.innerHTML=head('Indicadores','Informações calculadas com base nos registros da demonstração.')+'<div class="metrics">'+metric('Projetos',projects.length,'Total')+metric('Tarefas',tasks.length,'Total')+metric('Concluídas',tasks.filter(t=>t.status==='Concluído').length,'Total')+metric('Atrasadas',overdue.length,'Total')+'</div><section class="panel"><h2>Status das demandas</h2>'+STATUS.map(s=>'<div class="activity"><span>'+badge(s)+'</span><div style="width:45%"><div class="progress"><i style="width:'+(tasks.length?100*tasks.filter(t=>t.status===s).length/tasks.length:0)+'%"></i></div></div><b>'+tasks.filter(t=>t.status===s).length+'</b></div>').join('')+'</section>';
else el.innerHTML=head('Sobre a demonstração','Esta é uma versão pública e simplificada da JG+ Gestão.')+'<section class="panel"><h2>O que você pode testar</h2><p>Dashboard, cadastros fictícios, edição direta de células, etiquetas de status, filtros, demandas, agenda e indicadores.</p><div class="note"><b>Atenção:</b> não há autenticação real, compartilhamento de dados entre pessoas, área de contratos protegida nem sincronização com Google Agenda. Os dados são apenas locais e podem desaparecer ao limpar o navegador.</div><button class="btn secondary" id="reset">Restaurar exemplos</button></section>';
}
function inputFor(entity,r,field){const key='data-edit="'+entity+'" data-id="'+esc(r.id)+'" data-field="'+field+'"';const val=r[field]||'';if(field==='project')return '<select '+key+'>'+data.projects.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===val?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>';if(['status','priority','stage'].includes(field)){const arr=field==='status'?STATUS:field==='priority'?PRIOR:STAGES;return '<select '+key+'>'+arr.map(x=>'<option '+(x===val?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>'}return '<input '+key+' type="'+(field==='due'?'date':'text')+'" value="'+esc(val)+'">'}
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-page],[data-add],[data-delete],#reset');if(!e)return;if(e.dataset.page){page=e.dataset.page;query='';render()}else if(e.id==='reset'){if(confirm('Restaurar os exemplos? Seus registros locais serão substituídos.')){data=initial();query='';save();render()}}else if(e.dataset.add){const id='local-'+Date.now();if(e.dataset.add==='projects')data.projects.push({id,name:'Novo projeto',client:'Cliente fictício',owner:'Equipe A',stage:'Briefing',status:'Não iniciado',priority:'Média',due:date(15)});else data.tasks.push({id,title:'Nova demanda',project:data.projects[0]?.id||'',owner:'Equipe A',status:'Não iniciado',priority:'Média',due:date(10)});save();render()}else if(e.dataset.delete){if(!confirm('Excluir este registro fictício?'))return;data[e.dataset.delete]=data[e.dataset.delete].filter(x=>x.id!==e.dataset.id);if(e.dataset.delete==='projects')data.tasks=data.tasks.filter(t=>t.project!==e.dataset.id);save();render()}});
document.addEventListener('change',ev=>{const e=ev.target;if(e.dataset.edit){const r=data[e.dataset.edit].find(x=>x.id===e.dataset.id);if(r){r[e.dataset.field]=e.value;save();render()}}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){const cursor=ev.target.selectionStart;query=ev.target.value;render();const next=document.querySelector('#search');next?.focus();next?.setSelectionRange(cursor,cursor)}});
render();
</script></body></html>
